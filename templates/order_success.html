<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | Chavan Pheta</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

      body{
    background:#050505;
    color:white;
    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    flex-direction:column;
}

        .success-box{

            width:100%;
            max-width:700px;

            background:#111;

            border-radius:35px;

            padding:70px 50px;

            text-align:center;

            border:1px solid rgba(255,215,0,0.15);

            box-shadow:
            0px 0px 40px rgba(255,215,0,0.08);

        }

        .success-box h1{

            color:gold;

            font-size:48px;

            font-family:'Cinzel',serif;

            margin-bottom:30px;

        }

        .success-box p{

            color:#d0d0d0;

            line-height:2;

            font-size:18px;

            margin-bottom:45px;

        }

        .btn{

            display:inline-block;

            padding:16px 35px;

            border-radius:50px;

            text-decoration:none;

            background:gold;

            color:black;

            font-weight:600;

            transition:0.3s;

        }

        .btn:hover{

            background:white;

        }

       .success-container{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;
}

footer{
    width:100%;
    text-align:center;
    padding:25px 0;
    color:white;
    background:#000;
    border-top:1px solid rgba(255,215,0,0.2);
    font-size:16px;

    margin-top:auto;
}
.home-btn{

    display:inline-block;

    padding:16px 35px;

    border-radius:50px;

    text-decoration:none;

    background:transparent;

    color:gold;

    border:2px solid gold;

    font-weight:600;

    transition:0.3s;

}

.home-btn:hover{

    background:gold;

    color:black;

}
.btn-group{

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

}
    </style>

</head>

<body>

<div class="success-container">

    <div class="success-box">

        <h1>Order Confirmed</h1>

        <p>
            Thank you for choosing Chavan Pheta.

            Your order has been submitted successfully.

            Click below to continue on WhatsApp.
        </p>

        <a href="{{ whatsapp_url }}" class="btn">
            Continue to WhatsApp
        </a>
        <br><br>

<a href="/"
   class="home-btn">

   Back to Home

</a>

    </div>

</div>

<footer>
    © 2026 Chavan Pheta • Royal Indian Turbans
</footer>

</body>
